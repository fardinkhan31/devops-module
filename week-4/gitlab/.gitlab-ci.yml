stages:
  - build
  - test
  - deploy

variables:
  APP_NAME: "custom-api"

build_stage:
  stage: build
  image: node:22
  script:
    - npm ci
    - npm run build

test_stage:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm test

deploy_stage:
  stage: deploy
  image: node:22
  script:
    - npm ci
    - npm run build